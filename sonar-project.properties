# SonarQube configuration for arcana-macos.
sonar.projectKey=arcana-macos
sonar.projectName=arcana-macos
sonar.projectVersion=0.1.0

# Layout.
sonar.sources=Sources
sonar.tests=Tests
sonar.sourceEncoding=UTF-8

# Swift.
sonar.lang.patterns.swift=**/*.swift

# Coverage (lcov produced by scripts/coverage.sh). The exact key depends on the Swift
# analyzer installed on the server; the SonarSwift community plugin reads this one.
sonar.swift.coverage.reportPaths=coverage.lcov

# Exclusions — generated / vendored / build output and the thin launcher.
sonar.exclusions=**/.build/**,**/*.generated.swift,Sources/ArcanaMacApp/**
# Coverage is measured over the tested product-logic modules (ArcanaSync / ArcanaPluginContracts
# / ArcanaPlugins / ArcanaModel + the shell's logic). Excluded from the coverage metric (not from
# analysis): SwiftUI views + the App + the DI composition root + the executable (not unit-testable),
# and ArcanaKit (the P1 iOS-derived reference base, smoke-tested only).
sonar.coverage.exclusions=Tests/**,Sources/ArcanaMacApp/**,Sources/ArcanaKit/**,**/*App.swift,**/*View.swift,**/CompositionRoot.swift
